name: Daily Report

# Triggers the daily-report Cloudflare Worker once a day. The worker
# (workers/daily-report/) posts a plain-English usage summary to Discord.
# Scheduling lives here (GitHub Actions) rather than a Cloudflare cron
# because the CF account is at its 5-cron free-plan limit (#1092). The
# worker computes the Eastern calendar day from its own clock at run time,
# not from when this cron fires, so a late-running scheduled job still
# reports the correct day.

on:
  schedule:
    - cron: "12 13 * * *"  # ~9:12am EDT / ~8:12am EST daily. Offset minute (not :00): GitHub flags top-of-hour as a high-load window where scheduled runs are delayed/dropped (#1131).
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD Eastern-date override (manual recovery after a missed run)"
        required: false
        type: string

# Serializes scheduled and manual runs of this workflow instead of letting
# them overlap. queue: max is required alongside cancel-in-progress: false:
# GitHub's default (queue: single) would silently CANCEL an already-pending
# run when a new one is queued, even with cancel-in-progress: false (that
# flag only governs already-RUNNING jobs) - a queued manual recovery run
# could otherwise be dropped by the next scheduled cron firing before it
# starts. Does not cover a direct curl to the public Worker endpoint; see
# README for the procedural mitigation (#1720).
#
# `queue` IS valid current GitHub Actions syntax - do not "fix" this by
# removing it. `actionlint` v1.7.12 (2026-03-30, the latest release as of
# this writing) does not yet recognize it and reports "unexpected key" -
# its bundled schema predates this feature. Verified against the
# community-maintained schema at schemastore.org/github-workflow.json
# (which documents `queue: single|max` and cites live docs.github.com
# pages) and independently against context7 `/websites/github_en_actions`.
# A Codex code-diff review round flagged this as a P1 based on actionlint's
# false negative; rejected with this evidence, not reverted (#1720).
concurrency:
  group: daily-report
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-report worker
        env:
          TRIGGER_SECRET: ${{ secrets.DAILY_REPORT_TRIGGER_SECRET }}
          DATE_OVERRIDE: ${{ github.event.inputs.date }}
        run: |
          URL="https://enviouswispr-daily-report.saurabhav.workers.dev/"
          if [ -n "$DATE_OVERRIDE" ]; then
            URL="${URL}?date=${DATE_OVERRIDE}"
          fi
          # No --retry here (the retired product-health ping dropped its own
          # --retry 3 for the identical reason, issue #1589): this
          # worker posts a Discord failure notice as a SIDE EFFECT before
          # returning a non-2xx (src/index.js runReport's catch block), so a
          # blind curl retry on a transient 500/504 could post a duplicate or
          # confusing "failed" notice, or a false failure notice immediately
          # followed by a real report if the retry recovers (Codex code-diff
          # review catch, docs/audits/2026-07-09-1433-daily-report-codex-code-diff.txt).
          # A single failed attempt already turns this job red (GitHub's own
          # failure-email signal); manual recovery is the documented ?date=
          # override (README § Failure visibility), not an automatic retry.
          #
          # --fail-with-body, NOT -f. Both turn a non-2xx into a nonzero exit, but
          # plain -f SUPPRESSES the body, and the body is the only place the reason
          # exists: the worker returns "daily report failed: " + err.message
          # (src/index.js fetch catch), naming the failing query and its HTTP
          # status. Under -f with -o /dev/null every failure was diagnostically
          # empty, so #1969 had to argue about causes from job DURATIONS.
          BODY_FILE="$(mktemp)"
          RC=0
          curl -sS --fail-with-body \
            -H "x-trigger-secret: ${TRIGGER_SECRET}" \
            "$URL" \
            -o "$BODY_FILE" -w "worker responded HTTP %{http_code}\n" || RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "--- worker response body (failure reason) ---"
            # This repository is PUBLIC, so these logs are world-readable, and
            # Actions can only mask secrets it holds ITSELF - DISCORD_WEBHOOK_URL
            # is a CLOUDFLARE secret and is not maskable here. err.message is
            # whatever was thrown: every shape this exists to capture carries no
            # URL ("PostHog query <name> HTTP <status>", "Discord rejected the
            # report: HTTP <status>"), but an unexpected native throw could - a
            # malformed-URL TypeError out of deliverReport would quote the
            # webhook. So cap, then mask any URL. Capping FIRST is deliberate: it
            # keeps a long body from SIGPIPE-ing the masker under pipefail, and
            # a URL starting inside the kept prefix is still matched at its scheme.
            head -c 2000 "$BODY_FILE" \
              | sed -E 's#[a-zA-Z][a-zA-Z0-9+.-]*://[^[:space:]]*#<redacted-url>#g'
            echo
            exit "$RC"
          fi
