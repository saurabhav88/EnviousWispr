<script>
const data = JSON.parse(document.getElementById("atlas-data").textContent);
const root = document.documentElement;
function appearance() {
  const choice = root.dataset.theme;
  if (choice === "light" || choice === "dark") return choice;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function src(id) { const p = byId[id] || {}; const want = appearance();
  const have = p.appearances || ["light", "dark"];
  return "pictures/" + id + "-" + (have.includes(want) ? want : have[0]) + ".png"; }
function refreshPictures() { document.querySelectorAll("img[data-picture]").forEach(img => {
  img.src = src(img.dataset.picture); }); }
function el(tag, attrs, children) { const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
  (children || []).forEach(c => node.append(c)); return node; }
function pictureImg(id) { return el("img", {"data-picture": id, alt: id, loading: "lazy"}); }
const byId = Object.fromEntries(data.pictures.map(p => [p.id, p]));
const parts = document.getElementById("parts");
for (const part of data.parts) {
  const live = el("div", {class: "live"}); live.innerHTML = part.html;
  const copy = el("button", {class: "ew-btn"}, ["Copy snippet"]);
  copy.addEventListener("click", async () => { try { await navigator.clipboard.writeText(part.html);
    copy.textContent = "Copied"; } catch (e) { copy.textContent = "Select the text below"; } });
  const code = el("pre", {class: "meta hidden"}, [part.html]);
  const show = el("button", {class: "ew-btn ew-btn--quiet"}, ["Show HTML"]);
  show.addEventListener("click", () => code.classList.toggle("hidden"));
  const shot = part.picture === "none"
    ? el("div", {class: "shot meta"}, ["No app picture shows this part; it is drawn from its source (" + part.swift + ")."])
    : el("div", {class: "shot"}, [pictureImg(part.picture)]);
  const item = el("section", {class: "item", "data-search": (part.id + " " + part.title + " " + part.swift).toLowerCase()}, [
    el("h3", {}, [part.title]),
    el("div", {class: "meta"}, [part.swift + " \u00b7 " + part.file + " \u00b7 picture " + part.picture]),
    el("div", {class: "pair"}, [el("div", {}, [el("div", {class: "label"}, ["HTML part"]), live]),
      el("div", {}, [el("div", {class: "label"}, ["App picture"]), shot])]),
    el("div", {style: "display:flex;gap:8px"}, [copy, show]), code]);
  parts.append(item);
}
const groups = {};
for (const p of data.pictures) (groups[p.group] = groups[p.group] || []).push(p);
const holder = document.getElementById("pictures");
for (const [group, list] of Object.entries(groups)) {
  const grid = el("div", {class: "grid" + (group === "Settings pages" ? " pages" : "")});
  holder.append(el("h2", {}, [group]), grid);
  for (const p of list) {
    const shot = el("div", {class: "shot"});
    shot.append(pictureImg(p.id));
    const note = p.kind === "hand" ? "Manual photo, refresh by hand" + (p.captured ? " (" + p.captured + ")" : "") : "Photo test";
    grid.append(el("section", {class: "item", "data-search": (p.id + " " + p.title).toLowerCase()}, [
      el("h3", {}, [p.title]), el("div", {class: "meta"}, [p.id + " \u00b7 " + note + " \u00b7 inventory.md#" + p.id]), shot]));
  }
}
document.querySelectorAll("[data-theme-choice]").forEach(button => button.addEventListener("click", () => {
  const choice = button.dataset.themeChoice;
  if (choice === "system") delete root.dataset.theme; else root.dataset.theme = choice;
  document.querySelectorAll("[data-theme-choice]").forEach(b => b.setAttribute("aria-checked", String(b === button)));
  refreshPictures(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshPictures);
document.getElementById("q").addEventListener("input", event => { const q = event.target.value.toLowerCase().trim();
  document.querySelectorAll("[data-search]").forEach(n => n.classList.toggle("hidden", q !== "" && !n.dataset.search.includes(q))); });
refreshPictures();
</script>
