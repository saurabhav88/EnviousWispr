<!-- Controls inside rows. -->
<!-- part: tab-strip | Tabs across the top of a page | SettingsTabStrip | parts-controls -->
<div class="ew-root ew-tabs" role="tablist"><button class="ew-tab" role="tab" aria-selected="true"><span aria-hidden="true">&#x2338;</span>Engine</button><button class="ew-tab" role="tab" aria-selected="false"><span aria-hidden="true">&#x1F5E8;&#xFE0E;</span>Live Preview</button><button class="ew-tab" role="tab" aria-selected="false"><span aria-hidden="true">&#x1F514;&#xFE0E;</span>Chimes</button></div>
<!-- /part -->
<!-- part: choice-bar | A choice between 2-4 options | BrandedSegmentedPicker | parts-controls -->
<div class="ew-root ew-choices" role="radiogroup"><button class="ew-choice" role="radio" aria-checked="false">&#x263A;&#xFE0E; Casual</button><button class="ew-choice" role="radio" aria-checked="true">Neutral</button><button class="ew-choice" role="radio" aria-checked="false">Formal</button></div>
<!-- /part -->
<!-- part: switch | On/off switch | BrandedToggleStyle | parts-controls -->
<span style="display:inline-flex;gap:12px"><button class="ew-switch" role="switch" aria-checked="true" aria-label="On"></button><button class="ew-switch" role="switch" aria-checked="false" aria-label="Off"></button></span>
<!-- /part -->
<!-- part: field | Text field (focus shows a 2pt accent border) | .settingsFieldChrome(focused:) | parts-controls -->
<input class="ew-root ew-field" value="Typed text">
<!-- /part -->
<!-- part: help | The "?" help bubble beside a row title | SettingsInfoButton | parts-structure -->
<button class="ew-root ew-help" aria-label="Help">?</button>
<!-- /part -->
