name = "enviouswispr-daily-report"
main = "src/index.js"
compatibility_date = "2026-07-09"

# No Cloudflare cron: QStash owns three independent daily 09:12
# America/New_York HTTP triggers (#3570). See README.md for exact schedule IDs
# and recovery. GitHub Daily Report is retained for manual recovery only.

[vars]
POSTHOG_PROJECT_ID = "354235"
# The version scorecard's release list: OUR OWN Sparkle appcast, written by
# release.yml on every release and served by our Pages site. No token, no
# secret, no external rate limit (#2619). It replaced GitHub's releases API,
# whose unauthenticated 60-per-hour ceiling is PER IP and a Worker's outbound
# IP is shared with other tenants, so strangers spent our budget and the
# scorecard went missing five of nine mornings.
APPCAST_URL = "https://enviouswispr.com/appcast.xml"
# Independent Sentry write-up modes (#3547). Identifiers only.
SENTRY_ORG = "envious-labs-llc"
SENTRY_PROJECT_ID = "4511097112428544"
SENTRY_PROJECT_SLUG = "enviouswispr"

# Secrets (set via `npx wrangler secret put <NAME>`, never in this file):
#   POSTHOG_PERSONAL_API_KEY  - GCP secret `posthog-personal-api-key`
#   DISCORD_WEBHOOK_URL       - Keychain `enviouswispr.discord-webhook-session-logs` (EnviousNotes)
#   DISCORD_ANDROID_WEBHOOK_URL - Keychain `enviouswispr-android.discord-webhook-session-logs`;
#     Android Sentry write-up only, never a fallback into the Mac channel (#3547).
#   TRIGGER_SECRET            - gates the public `fetch` trigger; QStash sends it as
#                               the `x-trigger-secret` header (the workers.dev URL is public, so
#                               the trigger fails closed without it)
#   SENTRY_AUTH_TOKEN - GCP sentry-workers-readonly-token (event:read + org:read).
#     Use the same read-only token on daily-report and weekly-digest; never the
#     admin or CI release-upload token. Independent Sentry mode failure returns
#     nonzero with an unavailable notice, never invented zero counts. Performance
#     mode does not require this binding or make a Sentry request.
