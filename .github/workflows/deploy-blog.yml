name: Deploy Website

on:
  push:
    branches: [main]
    paths: ['website/**']
  schedule:
    # Daily rebuild at 14:07 UTC (~10:07 America/New_York) so future-dated blog
    # posts go live on their pubDate without a push. The build recomputes
    # "today" in Eastern (see website/src/utils/posts.ts isPublishedPost), so a
    # post dated for today becomes visible on the first run on/after that date.
    # Runs well after midnight ET in both EST and EDT, so posts always publish
    # on the correct calendar day. Safe to leave on year-round (a day with no
    # newly-due post skips the upload: see "Skip an unchanged deploy" below).
    - cron: '7 14 * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    # Production only ever receives main. A workflow_dispatch from another ref
    # (gh workflow run --ref <branch>) would publish that ref to Cloudflare's
    # `main` branch, and the deployed-output hash it saved would sit in that
    # ref's cache scope where the scheduled main run cannot see it, so the
    # next unchanged day would skip and leave the foreign content live.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint download links
        run: scripts/ci/check-download-link-utms.sh

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Astro site
        working-directory: website
        run: npm run build

      - name: Verify build output
        working-directory: website
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory dist/ does not exist"
            exit 1
          fi
          echo "Build output verified"

      # Skip an unchanged deploy. The daily cron rebuilt and re-uploaded
      # byte-identical output on most days (20 of 20 scheduled runs in the 30
      # days to 2026-09-13 deployed; posts go live on a handful of them). The
      # build is deterministic once the sitemap stopped stamping today's date
      # (#2889), so one hash over every file wrangler ships (dist/ and
      # functions/) says whether an upload would change anything.
      #
      # The record of "what is live" is the LIVE SITE ITSELF: every deploy
      # writes its hash to dist/deploy-manifest.txt, and the next run reads
      # that file back from the production domain. Nothing else can be the
      # authority: an Actions-cache record can outlive a rollback, a CLI
      # deploy, a foreign-ref dispatch, a failed save after a successful
      # upload, or cache eviction, and each of those was a way to skip while
      # production held something else (five review rounds on #2892).
      # Only scheduled runs skip: a push or a manual dispatch always deploys.
      - name: Hash what will ship
        id: manifest
        working-directory: website
        run: |
          set -euo pipefail
          hash="$(bash scripts/dist-manifest.sh dist functions)"
          printf '%s\n' "$hash" > dist/deploy-manifest.txt
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Decide whether to deploy
        id: decide
        run: |
          set -euo pipefail
          now="${{ steps.manifest.outputs.hash }}"
          # Read the live site's own record, bypassing every cache layer.
          live="$(curl -fsS --max-time 20 "https://enviouswispr.com/deploy-manifest.txt?cb=${{ github.run_id }}-${{ github.run_attempt }}" | tr -d '[:space:]' || true)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$live" ] && [ "$live" = "$now" ]; then
            echo "Live site already serves this build ($now); skipping upload."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying: event=${{ github.event_name }} live=${live:-unreadable} now=$now"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.decide.outputs.deploy == 'true'
        working-directory: website
        run: npx wrangler pages deploy dist/ --project-name=enviouswispr --branch=main
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tell IndexNow (Bing/Yandex/Naver) about posts that go live TODAY only.
      # Submitting just the newly-published URLs (not a daily blast of every URL)
      # is the protocol's intended use. Runs only after a successful deploy, and
      # is non-fatal: a flaky IndexNow response must not redden a good publish.
      # "Today" is computed in America/New_York to match the build-time
      # visibility gate in website/src/utils/posts.ts (isPublishedPost).
      - name: Notify IndexNow for posts published today
        if: steps.decide.outputs.deploy == 'true' && success()
        continue-on-error: true
        working-directory: website
        run: |
          TODAY="$(TZ=America/New_York date +%F)"
          urls=()
          for f in src/content/blog/*.md; do
            pd="$(grep -m1 '^pubDate:' "$f" | sed -E 's/^pubDate:[[:space:]]*//; s/"//g' | cut -dT -f1)"
            draft="$(grep -m1 '^draft:' "$f" | sed -E 's/^draft:[[:space:]]*//; s/"//g')"
            if [ "$pd" = "$TODAY" ] && [ "$draft" != "true" ]; then
              urls+=("https://enviouswispr.com/blog/$(basename "$f" .md)/")
            fi
          done
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No blog posts dated $TODAY (ET); nothing to submit to IndexNow."
            exit 0
          fi
          echo "Submitting ${#urls[@]} URL(s) published today to IndexNow:"
          printf '  %s\n' "${urls[@]}"
          bash scripts/indexnow-submit.sh "${urls[@]}"
