version: 2
# Volume-tuned for the hosted-runner era. Every Dependabot PR triggers a full
# Swift build on a paid shared runner, so group aggressively and widen cadence:
# - one grouped PR per ecosystem per month (vs ~weekly per-package before)
# - patch + minor auto-bump inside the group; major bumps emit their own PR
#   and get tagged 'needs-review' so a human (Claude session) decides
# - the 'ci' label referenced in Dependabot config must exist in the repo; it
#   doesn't today, so it's omitted until created
#
# #4488: every Dependabot job runs behind a proxy that refuses hosts outside its
# allowlist ("egress not allowlisted <host>", then a 403). Package.swift's
# CWebRTCAEC binaryTarget downloads from our own public host
# (models.enviouswispr.com), so the Swift job cannot resolve packages until that
# host is on the proxy's default list: requested in dependabot/proxy#360.
# A `registries` entry for the host with no credential does not help: GitHub
# does not pass it to the job (tried in #4494, job run 43009745050).

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      github-actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      swift-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      website-npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
