name: Deploy Website

on:
  push:
    branches: [main]
    paths: ['website/**']
  schedule:
    # Daily rebuild at 14:07 UTC (~10:07 America/New_York) so future-dated blog
    # posts go live on their pubDate without a push. The build recomputes
    # "today" in Eastern (see website/src/utils/posts.ts isPublishedPost), so a
    # post dated for today becomes visible on the first run on/after that date.
    # Runs well after midnight ET in both EST and EDT, so posts always publish
    # on the correct calendar day. Safe to leave on year-round (a day with no
    # newly-due post skips the upload: see "Skip an unchanged deploy" below).
    - cron: '7 14 * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint download links
        run: scripts/ci/check-download-link-utms.sh

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Astro site
        working-directory: website
        run: npm run build

      - name: Verify build output
        working-directory: website
        run: |
          if [ ! -d "dist" ]; then
            echo "Build output directory dist/ does not exist"
            exit 1
          fi
          echo "Build output verified"

      # Skip an unchanged deploy. The daily cron rebuilt and re-uploaded
      # byte-identical output on most days (20 of 20 scheduled runs in the 30
      # days to 2026-09-13 deployed; posts go live on a handful of them). The
      # build is deterministic once the sitemap stopped stamping today's date
      # (#2889), so one hash over every output file's path and content says
      # whether an upload would change anything. The hash of the last
      # SUCCESSFUL deploy lives in the Actions cache (saved after the deploy
      # step, never before it, so a failed upload is retried next run). The
      # cache key is per RUN and restored by prefix, so the newest entry is
      # always the last thing that reached production. A content-addressed
      # key would exact-hit an older main entry after a workflow_dispatch from
      # another ref deployed different content, and then suppress the upload
      # that should have put main back (cloud review on #2892).
      # Only scheduled runs skip: a push or a manual dispatch always deploys.
      - name: Hash build output
        id: manifest
        working-directory: website
        run: echo "hash=$(bash scripts/dist-manifest.sh dist)" >> "$GITHUB_OUTPUT"

      - name: Restore last deployed hash
        id: last
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: website/.last-deployed-manifest
          key: website-deploy-manifest-run-${{ github.run_id }}
          restore-keys: website-deploy-manifest-run-

      - name: Decide whether to deploy
        id: decide
        working-directory: website
        run: |
          last="$(cat .last-deployed-manifest 2>/dev/null || true)"
          now="${{ steps.manifest.outputs.hash }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$last" ] && [ "$last" = "$now" ]; then
            echo "Build output unchanged since the last deploy ($now); skipping upload."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying: event=${{ github.event_name }} last=${last:-none} now=$now"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.decide.outputs.deploy == 'true'
        working-directory: website
        run: npx wrangler pages deploy dist/ --project-name=enviouswispr --branch=main
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Record the hash only after a successful upload, under this run's key,
      # so the next run's prefix restore finds it as the newest entry.
      - name: Save deployed hash
        if: steps.decide.outputs.deploy == 'true' && success()
        working-directory: website
        run: echo "${{ steps.manifest.outputs.hash }}" > .last-deployed-manifest

      - name: Cache deployed hash
        if: steps.decide.outputs.deploy == 'true' && success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: website/.last-deployed-manifest
          key: website-deploy-manifest-run-${{ github.run_id }}

      # Tell IndexNow (Bing/Yandex/Naver) about posts that go live TODAY only.
      # Submitting just the newly-published URLs (not a daily blast of every URL)
      # is the protocol's intended use. Runs only after a successful deploy, and
      # is non-fatal: a flaky IndexNow response must not redden a good publish.
      # "Today" is computed in America/New_York to match the build-time
      # visibility gate in website/src/utils/posts.ts (isPublishedPost).
      - name: Notify IndexNow for posts published today
        if: steps.decide.outputs.deploy == 'true' && success()
        continue-on-error: true
        working-directory: website
        run: |
          TODAY="$(TZ=America/New_York date +%F)"
          urls=()
          for f in src/content/blog/*.md; do
            pd="$(grep -m1 '^pubDate:' "$f" | sed -E 's/^pubDate:[[:space:]]*//; s/"//g' | cut -dT -f1)"
            draft="$(grep -m1 '^draft:' "$f" | sed -E 's/^draft:[[:space:]]*//; s/"//g')"
            if [ "$pd" = "$TODAY" ] && [ "$draft" != "true" ]; then
              urls+=("https://enviouswispr.com/blog/$(basename "$f" .md)/")
            fi
          done
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No blog posts dated $TODAY (ET); nothing to submit to IndexNow."
            exit 0
          fi
          echo "Submitting ${#urls[@]} URL(s) published today to IndexNow:"
          printf '  %s\n' "${urls[@]}"
          bash scripts/indexnow-submit.sh "${urls[@]}"
