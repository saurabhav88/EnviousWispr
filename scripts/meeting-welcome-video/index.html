<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EnviousMeet welcome scene</title>
<style>
  /* The welcome slot on EnviousMeet's setup screen: 414 x 176 points (the 470-point card less
     its 28-point padding), rendered at 2x. Colors are
     the dark onboarding tokens (OnboardingDesignTokens.swift), so the card reads as one object
     on the light and the dark setup screen alike. */
  :root {
    --card: #1b1729; --card-2: #251f37; --text: #e8e4f1; --text-2: #aaa2bf; --text-3: #7a7290;
    --accent: #a78bfa; --success: #5cc99a; --fill: #6b4fd1; --surface: #201b2b;
    --border: rgba(184, 170, 214, 0.16); --rec: #ff5a5f;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    width: 414px; height: 176px; overflow: hidden; position: relative;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; color: var(--text);
  }
  #card {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
    background: radial-gradient(120% 140% at 0% 0%, #2a2140 0%, var(--card) 55%, #15121f 100%);
  }
  .abs { position: absolute; }
  /* Call window */
  #call {
    left: 12px; top: 12px; width: 186px; height: 152px; border-radius: 9px;
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden;
  }
  #call .bar {
    height: 19px; display: flex; align-items: center; gap: 4px; padding: 0 7px;
    background: rgba(255, 255, 255, 0.06); font-size: 9.5px; color: var(--text-2);
  }
  #call .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); }
  #call .title { margin-left: 6px; }
  #grid { position: absolute; left: 6px; right: 6px; top: 25px; bottom: 6px; display: grid;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 5px; }
  .tile { position: relative; border-radius: 6px; overflow: hidden; }
  .tile .face { position: absolute; left: 50%; top: 44%; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.92); }
  .tile .name { position: absolute; left: 5px; bottom: 4px; font-size: 8.5px; color: rgba(255, 255, 255, 0.88); }
  .tile .ring { position: absolute; inset: 0; border-radius: 6px; box-shadow: inset 0 0 0 2px var(--success); opacity: 0; }
  /* Question panel */
  #ask {
    right: 12px; top: 12px; width: 190px; padding: 9px 10px; border-radius: 10px; box-sizing: border-box;
    background: var(--card-2); border: 1px solid var(--border);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
  }
  #ask .q { font-size: 11.5px; font-weight: 600; }
  #ask .d { font-size: 9.5px; color: var(--text-2); margin-top: 2px; }
  #ask .row { display: flex; gap: 6px; margin-top: 8px; }
  #ask .btn { flex: 1; text-align: center; font-size: 10px; padding: 3.5px 0; border-radius: 6px; }
  #yes { background: var(--fill); color: #fff; font-weight: 600; }
  #no { background: var(--surface); color: var(--text); }
  /* Recording chip */
  #rec { right: 12px; top: 12px; display: flex; align-items: center; gap: 5px; font-size: 9.5px;
    color: var(--text-2); font-variant-numeric: tabular-nums; }
  #rec .r { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); }
  /* Transcript */
  #lines { left: 210px; right: 12px; top: 34px; }
  .line { margin-bottom: 9px; }
  .who { font-size: 9px; font-weight: 700; letter-spacing: 0.01em; }
  .say { font-size: 10.5px; line-height: 1.35; color: var(--text); margin-top: 1px; min-height: 14px; }
  .caret { display: inline-block; width: 1px; height: 11px; background: var(--accent); vertical-align: -1px; margin-left: 1px; }
</style>
</head>
<body>
<div id="card">
  <div class="abs" id="call">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="title">Zoom</span></div>
    <div id="grid">
      <div class="tile" style="background:#2e3a4a"><div class="face" style="background:#4a6a8c">P</div><div class="name">Priya</div><div class="ring" id="ring-0"></div></div>
      <div class="tile" style="background:#3a2e4a"><div class="face" style="background:#6a4a8c">M</div><div class="name">Marcus</div><div class="ring" id="ring-1"></div></div>
      <div class="tile" style="background:#2e4a3d"><div class="face" style="background:#4a8c6d">D</div><div class="name">Diana</div><div class="ring" id="ring-2"></div></div>
      <div class="tile" style="background:#4a3a2e"><div class="face" style="background:#8c6a4a"><svg width="14" height="14" viewBox="0 0 14 14" fill="rgba(255,255,255,0.92)"><circle cx="7" cy="4.4" r="2.9"/><path d="M1.6 13c0-3 2.4-5 5.4-5s5.4 2 5.4 5z"/></svg></div><div class="name" id="you-tile"></div><div class="ring" id="ring-3"></div></div>
    </div>
  </div>
  <div class="abs" id="ask">
    <div class="q" id="ask-q"></div>
    <div class="d" id="ask-d"></div>
    <div class="row"><div class="btn" id="yes"></div><div class="btn" id="no"></div></div>
  </div>
  <div class="abs" id="rec"><span class="r" id="rec-dot"></span><span id="rec-time">0:00</span></div>
  <div class="abs" id="lines"></div>
</div>
<script>
// Every on-screen word, per language. The app's own strings where the app shows them
// (Localizable.xcstrings: "Record this call?", "%@ started using the microphone.", "Yes", "No",
// "You"); the spoken lines are scene text.
const COPY = {
  en: {
    ask: "Record this call?", detail: "Zoom started using the microphone.", yes: "Yes", no: "No", you: "You",
    lines: [
      ["Priya", "Can we move the launch to the 17th?"],
      ["You", "Yes. I'll update the plan today."],
      ["Marcus", "I'll let support know."],
    ],
  },
  de: {
    ask: "Diesen Anruf aufnehmen?", detail: "Zoom nutzt jetzt das Mikrofon.", yes: "Ja", no: "Nein", you: "Du",
    lines: [
      ["Priya", "Können wir den Start auf den 17. verschieben?"],
      ["Du", "Ja. Ich passe den Plan heute an."],
      ["Marcus", "Ich sage dem Support Bescheid."],
    ],
  },
};
const lang = new URLSearchParams(location.search).get("lang") || "en";
const c = COPY[lang];
document.getElementById("ask-q").textContent = c.ask;
document.getElementById("ask-d").textContent = c.detail;
document.getElementById("yes").textContent = c.yes;
document.getElementById("no").textContent = c.no;
document.getElementById("you-tile").textContent = c.you;

const COLORS = { Priya: "#5cc99a", Marcus: "#f0a35e", You: "#a78bfa", Du: "#a78bfa" };
// Which tile lights for each line.
const TILE = { Priya: 0, Marcus: 1, You: 3, Du: 3 };
// Each line: label appears at `at`, typing runs from `at + 0.1` over `dur` seconds.
const SCHEDULE = [ { at: 3.3, dur: 1.3 }, { at: 4.9, dur: 1.2 }, { at: 6.4, dur: 0.9 } ];
const TOTAL = 9.0;

const linesEl = document.getElementById("lines");
const lineEls = c.lines.map(([who]) => {
  const el = document.createElement("div");
  el.className = "line";
  el.innerHTML = `<div class="who" style="color:${COLORS[who]}">${who}</div><div class="say"></div>`;
  linesEl.appendChild(el);
  return el;
});

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
// 0 before a, 1 after b, eased.
const ramp = (t, a, b) => ease((t - a) / (b - a));
// Fade back to the opening frame over the last 0.6 s so the loop has no jump.
const outro = (t) => 1 - ramp(t, 8.4, 9.0);

window.renderAt = (t) => {
  t = ((t % TOTAL) + TOTAL) % TOTAL;
  // Question: slides in at 0.9, Yes pressed at 2.4, gone by 2.9.
  const askIn = ramp(t, 0.9, 1.3);
  const askOut = ramp(t, 2.55, 2.9);
  const ask = document.getElementById("ask");
  ask.style.opacity = String(askIn * (1 - askOut));
  ask.style.transform = `translateY(${(1 - askIn) * -8 + askOut * -4}px)`;
  const press = t >= 2.3 && t < 2.6 ? Math.sin(((t - 2.3) / 0.3) * Math.PI) : 0;
  const yes = document.getElementById("yes");
  yes.style.transform = `scale(${1 - press * 0.06})`;
  yes.style.filter = `brightness(${1 + press * 0.25})`;
  // Recording chip from 3.0, the dot breathing, the timer counting.
  const rec = document.getElementById("rec");
  const recOn = ramp(t, 2.95, 3.25) * outro(t);
  rec.style.opacity = String(recOn);
  document.getElementById("rec-dot").style.opacity = String(0.55 + 0.45 * (0.5 + 0.5 * Math.cos((t - 3.0) * Math.PI * 1.6)));
  const secs = Math.max(0, Math.floor(t - 2.95));
  document.getElementById("rec-time").textContent = `0:${String(secs).padStart(2, "0")}`;
  // Transcript lines type in; the speaking tile lights.
  const fade = outro(t);
  let speaking = -1;
  c.lines.forEach(([who, text], i) => {
    const { at, dur } = SCHEDULE[i];
    const el = lineEls[i];
    const show = ramp(t, at, at + 0.2);
    el.style.opacity = String(show * fade);
    el.style.transform = `translateY(${(1 - show) * 4}px)`;
    const typed = clamp((t - at - 0.1) / dur);
    const n = Math.round(text.length * typed);
    const caret = typed > 0 && typed < 1 ? '<span class="caret"></span>' : "";
    el.querySelector(".say").innerHTML = text.slice(0, n).replace(/&/g, "&amp;").replace(/</g, "&lt;") + caret;
    if (t >= at && t < at + 0.1 + dur + 0.2) speaking = TILE[who];
  });
  // Before the recording, Priya is already talking: the call is on.
  if (t < 2.9 && t > 0.2) speaking = 0;
  for (let k = 0; k < 4; k++) {
    document.getElementById(`ring-${k}`).style.opacity = k === speaking ? "1" : "0";
  }
};

window.TOTAL = TOTAL;
document.fonts.ready.then(() => { window.renderAt(0); window.READY = true; });
</script>
</body>
</html>
