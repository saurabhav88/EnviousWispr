---
# Exam v2 for the DELIVERED correction judge on hosted GitHub macOS runners
# (#996). Hosted runners are virtual (`Apple M1 (Virtual)`) and expose no
# Neural Engine, so these receipts prove the model, tokenizer and decision
# logic on each macOS major on the CPU path; `scorecard.json["host"].virtual`
# says so. The Neural Engine path is examined on real hardware separately.
#
# Branch-run for now (push to this branch). The exam tool (`AliasRunner`)
# needs the macOS 26 SDK, so it is built once on macos-26 and carried to the
# older runner as an artifact, the same way `pr-check.yml` carries the app.
name: Exam the delivered edit judge on hosted macOS runners

on:
  push:
    branches:
      - probe/exam-hosted-runners

permissions:
  contents: read

env:
  REVISION: 3b376fbc-ec68ad6e
  MIRROR: https://models.enviouslabs.co/edit-judge/3b376fbc-ec68ad6e
  RUN_DIR: artifacts/issue-996-edit-judge/runs/20260920T170356Z-3b376fbc
  EXPORT_DIR: artifacts/issue-996-edit-judge/runs/20260920T170356Z-3b376fbc/exports/20260921T132135Z-ec68ad6e/fp16

jobs:
  build-runner:
    name: Build the exam tool on macOS 26
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build AliasRunner (release, locked to root pins)
        run: |
          set -euo pipefail
          swift --version
          python3 scripts/ci/seed-eval-package-pins.py Package.resolved scripts/eval/alias_runner
          swift build -c release --package-path scripts/eval/alias_runner --only-use-versions-from-resolved-file
          otool -l scripts/eval/alias_runner/.build/release/AliasRunner | grep -A3 LC_BUILD_VERSION | grep minos

      - name: Upload the exam tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-runner
          path: scripts/eval/alias_runner/.build/release/AliasRunner
          if-no-files-found: error
          retention-days: 7

  exam:
    name: Exam on ${{ matrix.runner }}
    needs: build-runner
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Report the runner
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          python3 --version

      - name: Download the exam tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: alias-runner
          path: scripts/eval/alias_runner/.build/release

      - name: Fetch the delivered model files from the mirror
        run: |
          set -euo pipefail
          chmod +x scripts/eval/alias_runner/.build/release/AliasRunner
          PKG="$EXPORT_DIR/xenc-mmbert-small-fp16.mlpackage"
          mkdir -p "$PKG/Data/com.apple.CoreML/weights" "$RUN_DIR/checkpoint/tokenizer"
          get() { curl -fsSL --retry 3 -o "$2" "$MIRROR/$1"; }
          get xenc-mmbert-small-fp16.mlpackage/Manifest.json "$PKG/Manifest.json"
          get xenc-mmbert-small-fp16.mlpackage/Data/com.apple.CoreML/model.mlmodel "$PKG/Data/com.apple.CoreML/model.mlmodel"
          get xenc-mmbert-small-fp16.mlpackage/Data/com.apple.CoreML/weights/weight.bin "$PKG/Data/com.apple.CoreML/weights/weight.bin"
          get training-manifest-shaped.json "$EXPORT_DIR/training-manifest-shaped.json"
          get verification.json "$EXPORT_DIR/verification.json"
          get tokenizer-contract.json "$RUN_DIR/tokenizer-contract.json"
          for f in tokenizer.json tokenizer_config.json special_tokens_map.json; do
            get "tokenizer/$f" "$RUN_DIR/checkpoint/tokenizer/$f"
          done
          shasum -a 256 "$PKG/Data/com.apple.CoreML/weights/weight.bin" "$EXPORT_DIR/training-manifest-shaped.json" "$RUN_DIR/tokenizer-contract.json"

      - name: Run exam v2 (frozen-report partition)
        id: exam
        run: |
          set -uo pipefail
          python3 scripts/eval/edit_judge_gate.py --mode run --judge xenc-mmbert-small --partition frozen-report --exam v2 \
            --training-manifest "$EXPORT_DIR/training-manifest-shaped.json" > scorecard.json 2> gate-stderr.txt
          rc=$?
          cat gate-stderr.txt
          echo "gate exit $rc"
          python3 - <<'EOF'
          import json
          d = json.load(open("scorecard.json"))
          print(json.dumps({k: d.get(k) for k in ("pass", "reasons", "correction_recall", "false_add_rate", "latency_ms", "host")}, indent=1))
          EOF
          # Exit 1 is a real FAIL verdict and must be visible; exit 2 is infra.
          exit $rc

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exam-receipt-${{ matrix.runner }}
          path: |
            scorecard.json
            gate-stderr.txt
            benchmark-results/eval/edit-judge/runs/
          if-no-files-found: error
          retention-days: 30
