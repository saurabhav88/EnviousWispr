name: Main Post-Merge Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Everything this workflow's behaviour depends on, so a PR touching any of
    # it re-runs the workflow against itself. The composite action and the
    # revision guard are listed because a change to either silently alters every
    # job here while leaving the workflow file untouched (#1994).
    paths:
      - '.github/workflows/main-post-merge.yml'
      - '.github/actions/xcode-ci-setup/action.yml'
      - 'scripts/ci/verify-checked-out-revision.sh'
      - 'scripts/ci/post-merge-should-run.sh'
      # #2401: both lanes below decide their verdict through this owner, so a
      # change to it alters every job here while leaving the workflow untouched —
      # the same reason the composite action and the revision guard are listed.
      - 'scripts/lib/lane-verdict.sh'
      - 'scripts/lib/lane-verdict.py'
  schedule:
    # Hourly re-validation of main HEAD (#2334): during a merge train,
    # cancel-in-progress cancels every push run before it completes, so main
    # can sit unverified for hours. The schedule guarantees a green signal
    # exists within an hour even then. The minute is offset from :00 because
    # GitHub flags top-of-hour as a high-load window where scheduled runs are
    # delayed or dropped (#1131). The schedule-guard job skips the macOS
    # matrix when this HEAD already has a green full-matrix run, so an idle
    # main costs no macOS minutes.
    - cron: '7 * * * *'
  workflow_dispatch:

# Concurrency group per event (#2334): push runs group as
# `main-post-merge-push-refs/heads/main`, scheduled runs as
# `main-post-merge-schedule-refs/heads/main`, PR runs as
# `main-post-merge-pull_request-<number>`. The event_name segment isolates
# the schedule from push: a newer push can still cancel an in-flight push
# run, but it can never cancel an in-flight scheduled run — which is what
# lets the hourly validation survive a merge train. Do not "simplify" this
# group: the push path's per-ref isolation is load-bearing.
concurrency:
  group: main-post-merge-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Shared Xcode-engine constants (#913 PR3).
env:
  DERIVED_DATA_PATH: .derivedData/CI
  XCODE_PROJECT: EnviousWispr.xcodeproj
  XCODE_SCHEME: EnviousWispr
  XCODE_RELEASE_SCHEME: EnviousWispr-Release
  # Xcode forwards TEST_RUNNER_* into the test process, stripping the prefix; an
  # INHERITED variable does not arrive at all, so a suite cannot answer "am I on a
  # hosted runner" by reading the runner's own CI. Measured both ways (#2376).
  #
  # What this gates: rows that freeze RENDERED TEXT GEOMETRY. Those numbers are a
  # reading of one Mac's font metrics — eleven of twelve failed here while all
  # twelve passed on the development machine, same commit. The claims that travel
  # are asserted separately and run in both places.
  TEST_RUNNER_CI: "true"

# Job layout (#1994). This ran as ONE job until 2026-08-12 and grew into its
# 45-minute cap: eleven completed runs measured 34.7 min (min) / 40.4 (median) /
# 44.0 (max), and five runs were killed at the cap outright, so `main` went
# unverified. Measured step costs across six complete runs:
#
#   release tests  19.5 - 25.8 min   <- the long pole
#   debug tests     7.0 -  9.5 min   <- was sitting on the critical path
#   build release   3.9 -  4.8 min
#   build debug     1.4 -  2.6 min
#
# The two test suites were sequential for no sequencing reason. They now run as
# two parallel jobs with independent budgets, which takes the debug suite off
# the critical path and gives the release suite its own 45 minutes instead of
# ~36 after the debug run has eaten into them.
#
# `release-validation` remains the sole cache WRITER and still builds BOTH
# configurations, because pr-check.yml restores this cache (two restore steps,
# no save) and depends on its directory shape. Splitting the cache across two
# writers would change that contract; this change deliberately does not.
jobs:
  # Cheap Linux gate so both macOS jobs share ONE classification decision
  # rather than each computing its own and risking disagreement.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_build: ${{ steps.changes.outputs.needs_build }}

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout push or dispatch ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify checked-out revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/verify-checked-out-revision.sh

      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              scripts/ci/classify-changes.sh --push-diff "$BEFORE" "$AFTER"
              ;;
            pull_request)
              scripts/ci/classify-changes.sh "$BASE_SHA" "$HEAD_SHA"
              ;;
            workflow_dispatch)
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
              echo "==> Manual diagnostic dispatch requires the full Xcode matrix"
              ;;
            schedule)
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
              echo "==> Scheduled main-HEAD validation always runs the full Xcode matrix (#2334)"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

  # #2334. The schedule's only reason to exist is a merge train, where every
  # push run of this workflow is cancelled before it completes. The guard
  # answers whether the current main HEAD already has a green full-matrix
  # run; if so the expensive macOS jobs skip and an idle main costs no macOS
  # minutes. It runs on schedule events ONLY: the push path must stay
  # unconditional and never consults it. Anything the guard cannot determine
  # answers "run" — a guard that failed closed toward skipping would silently
  # restore the exact hole #2334 is about.
  schedule-guard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checked-out revision
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: scripts/ci/verify-checked-out-revision.sh

      - name: Decide whether main HEAD is already validated
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/ci/post-merge-should-run.sh --sha "${{ github.sha }}"

  # The long pole, and the cache WRITER. Builds both configurations (the cache
  # shape pr-check.yml restores) but runs only the release suite.
  release-validation:
    needs: [classify, schedule-guard]
    # #2334: the schedule path additionally requires the guard to answer
    # "run". On every other event the guard is skipped and this reduces to
    # the original condition — the push path is unconditional by design.
    #
    # `!cancelled()` is a status check function, so it removes the implicit
    # success() that otherwise skips a job whenever a `needs` dependency is
    # skipped — and schedule-guard skips on every non-schedule event, which
    # was silently dragging both macOS suites into the skip (run 32653384491).
    # With the implicit success() gone, the classify dependency is enforced
    # explicitly. It is `!cancelled()`, not `always()`: the latter would run
    # the suites even while the run is being cancelled, which is the
    # merge-train waste #2334 exists to reduce.
    if: >-
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.needs_build == 'true' &&
      (github.event_name != 'schedule' || needs.schedule-guard.outputs.should_run == 'yes')
    runs-on: macos-26
    # Worst observed critical path for this job's steps is ~36 min (44.0 min
    # whole-run max, less the 8.0 min debug suite that run executed). 45 leaves
    # ~9 min of headroom against ~1 min before this split.
    timeout-minutes: 45

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout push or dispatch ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify checked-out revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/verify-checked-out-revision.sh

      - name: Xcode CI setup
        id: setup
        uses: ./.github/actions/xcode-ci-setup
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}

      # Both configurations are built here because this job writes the cache
      # pr-check.yml restores for its own debug AND release jobs. Dropping the
      # debug build would shrink that cache and slow every future PR.
      - name: Build (debug, Xcode)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64

      - name: Build (release, Xcode)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_RELEASE_SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64

      # ENABLE_TESTABILITY=YES is required on the release TEST invocation only:
      # the test targets use `@testable import`, which needs the first-party
      # modules built with `-enable-testing`. Debug enables testability by
      # default; Release does not, so without this the test build fails with
      # "module built without '-enable-testing'". It is NOT set on the release
      # `build` step above, so the shippable release artifact stays non-testable
      # and fully optimized. (Mirrors the old `swift test -c release` behavior.)
      - name: Run logic tests (release config, Xcode)
        id: release-tests
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_RELEASE_SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$GITHUB_WORKSPACE/xcode-test-release.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64 \
            ENABLE_TESTABILITY=YES 2>&1 | tee xcode-test-release.log

          # Require a positive executed-test count (see pr-check.yml rationale):
          # a presence-grep would green a zero-test run. #2401: that guard is
          # complete about the EMPTY case and is kept unchanged inside the shared
          # owner, which additionally reads the named .xcresult so a TRUNCATED
          # run cannot pass — a crashed bundle prints zero failure marks and
          # concludes SUCCEEDED.
          . "$GITHUB_WORKSPACE/scripts/lib/lane-verdict.sh"
          ew_lane_verdict \
            "xcode-test-release.log" \
            "$GITHUB_WORKSPACE/xcode-test-release.xcresult" \
            "Post-merge Release lane"

      - name: Summarize release-test failure
        if: failure() && steps.release-tests.outcome == 'failure'
        run: |
          RESULT_BUNDLE="$GITHUB_WORKSPACE/xcode-test-release.xcresult"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "::warning::Release-test xcresult was not created"
            exit 0
          fi

          echo "::group::xcresult build summary"
          xcrun xcresulttool get build-results \
            --path "$RESULT_BUNDLE" \
            --compact || echo "::warning::Build summary unavailable; raw xcresult will be uploaded"
          echo "::endgroup::"

          echo "::group::xcresult test summary"
          xcrun xcresulttool get test-results summary \
            --path "$RESULT_BUNDLE" \
            --compact || echo "::warning::Test summary unavailable; raw xcresult will be uploaded"
          echo "::endgroup::"

      - name: Upload release-test failure diagnostics
        if: failure() && steps.release-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-release-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xcode-test-release.log
            xcode-test-release.xcresult
          if-no-files-found: warn
          retention-days: 7

      # Save only when the build/tests succeeded and the restore was not an exact
      # hit. The primary key carries github.sha, so a first run for this commit
      # always saves; a rerun of the same commit exact-hits and skips. PR and
      # manual diagnostic runs remain restore-only.
      - name: Save Xcode build cache
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          success() &&
          steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          # MUST stay identical to the restore paths in
          # .github/actions/xcode-ci-setup/action.yml — a save/restore pair that
          # disagrees produces a permanently cold cache with no error anywhere.
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ${{ env.DERIVED_DATA_PATH }}/Build
            ${{ env.DERIVED_DATA_PATH }}/*/SourcePackages
          key: ${{ steps.setup.outputs.cache-primary-key }}

  # Runs in parallel with release-validation. Restore-only: it never writes the
  # cache, so the writer contract with pr-check.yml has exactly one owner.
  debug-validation:
    needs: [classify, schedule-guard]
    # #2334: same schedule guard and status-function rationale as
    # release-validation (see above).
    if: >-
      !cancelled() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.needs_build == 'true' &&
      (github.event_name != 'schedule' || needs.schedule-guard.outputs.should_run == 'yes')
    runs-on: macos-26
    # Whole-job duration over the 20 most recent successful runs: 666-1008s
    # (11.1-16.8 min), median ~850s. The CI-speed pass added coverage
    # instrumentation to this job (see the coverage step below); pr-check.yml's
    # build-debug ran the same suite WITH coverage at 697-1194s on the same
    # runner class, so ~20 min is the realistic new worst case. 30 keeps ~1.5x
    # against that, sized from the measured spread rather than a round number.
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout push or dispatch ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify checked-out revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/verify-checked-out-revision.sh

      - name: Xcode CI setup
        uses: ./.github/actions/xcode-ci-setup
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}

      - name: Build (debug, Xcode)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64

      - name: Run logic tests (debug, Xcode)
        id: debug-tests
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$GITHUB_WORKSPACE/xcode-test-debug.xcresult" \
            -enableCodeCoverage YES \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64 2>&1 | tee xcode-test-debug.log

          # Require a positive executed-test count (see pr-check.yml rationale):
          # a presence-grep would green a zero-test run. #2401: that guard is
          # complete about the EMPTY case and is kept unchanged inside the shared
          # owner, which additionally reads the named .xcresult so a TRUNCATED
          # run cannot pass — a crashed bundle prints zero failure marks and
          # concludes SUCCEEDED.
          . "$GITHUB_WORKSPACE/scripts/lib/lane-verdict.sh"
          ew_lane_verdict \
            "xcode-test-debug.log" \
            "$GITHUB_WORKSPACE/xcode-test-debug.xcresult" \
            "Post-merge Debug lane"

      # #1600, MOVED here from pr-check.yml's build-debug lane in the CI-speed
      # pass. It was always informational — no percentage gate, because coverage
      # measures execution rather than assertion quality and a threshold would
      # invite padding tests to hit a number. Instrumenting every first-party
      # module cost that on the PR critical path for a figure nothing gated, so
      # it now runs once per merge instead of once per push, on the same Debug
      # suite and the same runner.
      #
      # Never allowed to fail this job: continue-on-error at the step level, plus
      # internal fail-open logic with no `set -e`.
      - name: Coverage summary (debug, informational only)
        continue-on-error: true
        run: |
          set -uo pipefail
          REPORT=$(xcrun xccov view --report --json "$GITHUB_WORKSPACE/xcode-test-debug.xcresult" 2>/dev/null) || true
          if [ -z "$REPORT" ]; then
            echo "==> Coverage summary unavailable (xccov produced no output)"
            exit 0
          fi
          # The report's root `.lineCoverage` aggregates EVERY instrumented
          # target, including the .xctest bundles themselves and third-party
          # static libraries (FluidAudio alone carries ~45k executable lines) —
          # inflating/diluting the number away from actual Sources/ coverage.
          # Every first-party module is named `EnviousWispr*` 1:1 with its
          # Sources/ directory (frameworks + the thin app shell + the ASR XPC
          # service); filter to those and exclude .xctest/.bundle to isolate real
          # production-code coverage. (#1600)
          FIRST_PARTY=$(echo "$REPORT" | jq '
            [.targets[] | select(.name | startswith("EnviousWispr"))
              | select((.name | endswith(".xctest")) or (.name | endswith(".bundle")) | not)]
            | {covered: (map(.coveredLines) | add // 0), executable: (map(.executableLines) | add // 0)}
          ' 2>/dev/null)
          COVERED=$(echo "$FIRST_PARTY" | jq -r '.covered // empty' 2>/dev/null)
          EXECUTABLE=$(echo "$FIRST_PARTY" | jq -r '.executable // empty' 2>/dev/null)
          if [ -n "$COVERED" ] && [ -n "$EXECUTABLE" ] && [ "$EXECUTABLE" -gt 0 ]; then
            PCT_DISPLAY=$(awk -v c="$COVERED" -v e="$EXECUTABLE" 'BEGIN{printf "%.1f", (c/e)*100}')
            echo "==> Debug-lane first-party line coverage: ${PCT_DISPLAY}% (${COVERED}/${EXECUTABLE} lines)"
            echo "Debug-lane first-party line coverage: **${PCT_DISPLAY}%** (${COVERED}/${EXECUTABLE} lines — Sources/ only, excludes test bundles and third-party deps; informational, no gate)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "==> Coverage summary unavailable (could not parse xccov JSON or no first-party targets found)"
          fi

      # The release job had failure diagnostics and the debug job did not, which
      # meant a debug-only failure on main left nothing to read. Same treatment
      # for both suites now that they are peers (#1994).
      - name: Summarize debug-test failure
        if: failure() && steps.debug-tests.outcome == 'failure'
        run: |
          RESULT_BUNDLE="$GITHUB_WORKSPACE/xcode-test-debug.xcresult"
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "::warning::Debug-test xcresult was not created"
            exit 0
          fi

          echo "::group::xcresult test summary"
          xcrun xcresulttool get test-results summary \
            --path "$RESULT_BUNDLE" \
            --compact || echo "::warning::Test summary unavailable; raw xcresult will be uploaded"
          echo "::endgroup::"

      - name: Upload debug-test failure diagnostics
        if: failure() && steps.debug-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-debug-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xcode-test-debug.log
            xcode-test-debug.xcresult
          if-no-files-found: warn
          retention-days: 7

  # One place that says whether main is green. Without this, a reader has to
  # combine three job results by eye, and a SKIPPED job looks like a failure.
  post-merge-result:
    needs: [classify, release-validation, debug-validation, schedule-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Post result
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_GUARD_RESULT: ${{ needs.schedule-guard.result }}
          SCHEDULE_GUARD: ${{ needs.schedule-guard.outputs.should_run }}
          NEEDS_BUILD: ${{ needs.classify.outputs.needs_build }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RELEASE_RESULT: ${{ needs.release-validation.result }}
          DEBUG_RESULT: ${{ needs.debug-validation.result }}
        run: |
          set -euo pipefail
          echo "classify=$CLASSIFY_RESULT release=$RELEASE_RESULT debug=$DEBUG_RESULT needs_build=${NEEDS_BUILD:-unknown}"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::Change classification did not complete (result=$CLASSIFY_RESULT) — main is UNVERIFIED"
            exit 1
          fi

          # #2334: the scheduled path consults the skip guard; the push path
          # does not. A guard that answered "no" is an INTENDED skip — the
          # full matrix already ran green on this HEAD — and must not fall
          # into the skipped-while-needs_build defect below.
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE_GUARD_RESULT" != "success" ]; then
              echo "::error::Schedule guard did not complete (result=$SCHEDULE_GUARD_RESULT) — cannot confirm main HEAD is validated — main is UNVERIFIED"
              exit 1
            fi
            if [ "$SCHEDULE_GUARD" = "no" ]; then
              echo "Scheduled validation skipped: main HEAD already has a green full-matrix run"
              exit 0
            fi
          fi

          if [ "$NEEDS_BUILD" != "true" ]; then
            # Both validation jobs are skipped by their `if:` in this case, which
            # is the intended outcome, not a failure.
            echo "Change classified as non-code; full Xcode validation intentionally skipped"
            exit 0
          fi

          # needs_build=true, so BOTH suites must have actually run and passed.
          # Anything else — failure, cancelled (the cap), or skipped — means main
          # was not verified, and each is reported distinctly so a cap kill is
          # never mistaken for a test failure.
          status=0
          for pair in "release:$RELEASE_RESULT" "debug:$DEBUG_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success)
                echo "==> $name validation passed"
                ;;
              cancelled)
                echo "::error::$name validation was CANCELLED — either it hit its timeout-minutes cap or a newer commit superseded this run. Check the job duration against its cap before reading this as a test failure (#1994)."
                status=1
                ;;
              skipped)
                echo "::error::$name validation was SKIPPED while needs_build=true — this is a workflow wiring defect, not a code failure"
                status=1
                ;;
              *)
                echo "::error::$name validation did not pass (result=$result)"
                status=1
                ;;
            esac
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::main is NOT verified green"
          else
            echo "Full validation passed"
          fi
          exit "$status"
