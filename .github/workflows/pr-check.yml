name: PR Check

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Shared Xcode-engine constants for both macOS lanes (#913 PR3). The Ubuntu
# aggregator inherits these harmlessly.
env:
  DERIVED_DATA_PATH: .derivedData/CI
  XCODE_PROJECT: EnviousWispr.xcodeproj
  XCODE_SCHEME: EnviousWispr
  XCODE_RELEASE_SCHEME: EnviousWispr-Release
  # Xcode forwards TEST_RUNNER_* into the test process, stripping the prefix; an
  # INHERITED variable does not arrive at all, so a suite cannot answer "am I on a
  # hosted runner" by reading the runner's own CI. Measured both ways (#2376).
  #
  # What this gates: rows that freeze RENDERED TEXT GEOMETRY. Those numbers are a
  # reading of one Mac's font metrics — eleven of twelve failed here while all
  # twelve passed on the development machine, same commit. The claims that travel
  # are asserted separately and run in both places.
  TEST_RUNNER_CI: "true"

jobs:
  # build-and-test: the ONE required macOS lane (#3013). ONE Release compile,
  # `build-for-testing` with ENABLE_TESTABILITY=YES (#3348; issue #1539: a test file
  # referencing a #if DEBUG-only Sources symbol without gating itself compiles
  # in Debug and vanishes in Release), whose products feed the String Catalog
  # check, the older-macOS linkage assert, the snapshot for the advisory macOS 14
  # launch job, and the FULL logic suite (`test-without-building`, never a second
  # compile) + the FoundationModels compile probe + the standalone eval packages.
  # The testable app is a COMPATIBILITY SMOKE CHECK: production stripping and the
  # exact production startup are not covered here; release.yml launch-on-macos-14
  # launches the notarized DMG on macOS 14 before anything is published (#3348).
  #
  # The Debug lane that used to run beside this one is gone: the founder's Mac
  # runs the Debug suite before every push, and post-merge still runs the full
  # Debug suite on main, so PRs are gated on the Release configuration (built
  # testable, #3348). What that moves: Debug-only compilation and Debug-specific behaviour are now
  # found after merge instead of before. Measured before the change (2026-09-16,
  # docs/audits/ci-test-burden-2026-09-16): five macOS jobs and ~65 Mac-minutes
  # per app-code PR on a five-slot account, 8 min of queue in the sample.
  # Step-level needs_build gating. (#913 PR3 → Xcode engine.)
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 60
    # Least privilege (carried over from the retired older-macos-launch.yml): this
    # job builds and runs branch-controlled code and needs no write capability.
    # Artifacts move between jobs of the same run on the Actions runtime token.
    permissions:
      contents: read
    # Content-detection verdict for the aggregator's honest status line (#1089).
    outputs:
      needs_build: ${{ steps.changes.outputs.needs_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # #825: keep FULL history. "Detect code changes" diffs
          # pull_request.base.sha, which can predate a shallow clone when main
          # advances mid-PR -> "fatal: bad object" -> build-check red before any
          # build runs. Do not re-shallow without explicitly fetching BASE_SHA.
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify-changes.sh "$BASE_SHA" "$HEAD_SHA"

      # #3505: the eval-package compile (last step of this job) took 669 s of a
      # 33-minute check on every app-code PR. It runs only when the PR changes one
      # of the packages' inputs, which scripts/ci/eval-package-inputs.py DERIVES
      # from the manifests (root targets reachable from the products the packages
      # use, plus manifests, lockfile and these scripts) rather than a hand list
      # that could miss a new dependency. Every doubt (empty SHA, failed diff,
      # unreadable manifest) answers true. The self-test runs here, not in the
      # ubuntu aggregator, because the derivation needs `swift package`.
      - name: Detect eval-package input changes
        id: eval_inputs
        if: steps.changes.outputs.needs_build == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scripts/ci/needs-eval-packages.sh --self-test
          scripts/ci/needs-eval-packages.sh "$BASE_SHA" "$HEAD_SHA"

      # #1778: the notices gate used to run ONLY during release packaging, so a
      # dependency bump that forgot the generator sat green on main until someone
      # tried to ship - v2.4.1 lost two release runs to exactly that (Sparkle
      # 2.9.4 via #1733, swift-syntax via #1741). `--check` reads only committed
      # files (no .build/checkouts), so it is seconds and runs unconditionally:
      # a paths filter here would be one more thing that can drift out of sync.
      - name: Verify third-party notices are in sync
        run: scripts/ci/gen-third-party-notices.sh --check

      # #2592: the whole Xcode setup (toolchain through project generation) is
      # ONE owner, shared with both main-post-merge.yml jobs. The `if:` here skips
      # the entire action for a docs-only PR; the action's header says why the
      # steps inside carry none.
      - name: Xcode CI setup
        id: setup
        if: steps.changes.outputs.needs_build == 'true'
        uses: ./.github/actions/xcode-ci-setup
        with:
          derived-data-path: ${{ env.DERIVED_DATA_PATH }}
          configuration: release

      # #3524 PR 3: the Dev-build catalog receipt wrapper (scripts/lib/l10n-build-with-receipt.sh)
      # and its two callers, on owned git fixtures with a stub build; it asks the real Xcode
      # for its build version, so it lives here, after Xcode setup and before the costly build.
      - name: Catalog receipt wrapper self-test
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          python3 scripts/lib/l10n-build-with-receipt-test.py

      # #3019: every build/test phase runs through `ew_phase`
      # (scripts/lib/ci-phase.sh): same command, same exit status, plus a named
      # log and the seconds for the EW-CI-METRICS line at the end of the job.
      #
      # #3348: the only Release compile in this job. It used to follow a plain
      # non-testable `xcodebuild build` (324-719 s) whose products fed the three
      # checks below; ENABLE_TESTABILITY changes flags, so nothing was reused.
      # Measured before removing it (Xcode 27.0, one tree, separate DerivedData):
      # the testable and non-testable apps had identical bundle inventories (180
      # files), Mach-O sets (8), load commands, rpaths, minos, Info.plist and
      # extracted .stringsdata; the testable app imports 146 extra symbols, all
      # from baseline libraries (libSystem, SwiftUI, libswiftCore...), with zero
      # weak/strong or library flips on shared symbols, and both pass
      # check-weak-linked-symbols.sh with identical summaries.
      - name: Build for testing (release, Xcode)
        id: release-test-build
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/scripts/lib/ci-phase.sh"
          ew_phase build_for_testing_release xcode-build-for-testing-release.log -- xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_RELEASE_SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath "$GITHUB_WORKSPACE/xcode-build-for-testing-release.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            VALID_ARCHS=arm64 \
            ENABLE_TESTABILITY=YES

      - name: Upload release test-build failure evidence
        if: failure() && steps.release-test-build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-build-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xcode-build-for-testing-release.log
            xcode-build-for-testing-release.xcresult
          if-no-files-found: warn
          retention-days: 7

      # #3142: the committed String Catalog must equal what the compiler extracts
      # from the Release build that just ran. Exit 1 prints the added, removed and
      # changed keys (and fails if a DEV_ONLY_KEYS member is ever extracted here,
      # #3524); the printed repair names the Dev partial repair first and this
      # Release check stays the authority for removals. Exit 2 means the check could
      # not run (toolchain, missing inputs), never "in sync". The sync reads only
      # production-target .stringsdata, so the test targets this build adds are
      # not extracted (and an unknown target folder is refused, not included). No
      # Dev build runs here (founder 2026-10-08, plan §3.3 amendment): the pre-push
      # hook checks the Dev extraction on the Mac.
      - name: Check String Catalog is in sync (release)
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          scripts/lib/l10n-catalog-sync.sh --check \
            --derived-data "$DERIVED_DATA_PATH" \
            --configuration Release

      # Older-macOS launch safety, on the REQUIRED gate rather than beside it.
      #
      # The app is built against the macOS 26 SDK with a macOS 14 deployment target. A framework
      # or symbol from above the baseline that is bound STRONGLY makes dyld abort at launch on an
      # older Mac, before any `#available` check of ours runs, so the app never opens and the
      # in-app "needs a newer macOS" message is never reached.
      #
      # It lives here because `build-check` is the only check the branch ruleset requires: a
      # standalone workflow can go red without blocking the merge it exists to block. Since #3348
      # it inspects the testable Release app (see the build step for the measured equivalence);
      # release.yml runs the same gate on the notarized DMG app. The empirical macOS 14 LAUNCH
      # stays in `older-macos-launch` below and stays advisory — it depends on a hosted image with
      # a retirement date and on a headless app start, neither of which belongs on the required path.
      # Static, deterministic, seconds; the self-test runs first so a guard that has stopped
      # inspecting anything fails here rather than passing quietly.
      - name: Assert older-macOS launch safety (linkage)
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          # Named explicitly, never `find | head -1`. This job restores a DerivedData cache, so a
          # stale Debug product can sit beside the Release one and an unordered match could
          # inspect it — letting a Release-only linkage problem through the required gate.
          APP="$DERIVED_DATA_PATH/Build/Products/Release/EnviousWispr.app"
          # `-d`, not `-n`: the path is a literal now, so a non-empty test would always pass
          # and the check would run against a bundle that does not exist.
          [ -d "$APP" ] || { echo "FAIL: release app not at $APP" >&2; exit 1; }
          # The self-test drives a single binary (its contract); the real check gets the whole
          # bundle so embedded frameworks are scanned too — dyld loads those at startup, and a
          # strong post-baseline import inside one aborts the process just as surely.
          ./scripts/ci/check-weak-linked-symbols-test.sh "$APP/Contents/MacOS/EnviousWispr"
          ./scripts/ci/check-weak-linked-symbols.sh "$APP"

      # Snapshot for the advisory macOS 14 launch job: the TESTABLE Release app
      # (compatibility smoke check, #3348); the exact shipped bundle is launched
      # on macOS 14 by release.yml launch-on-macos-14. Tarred, never uploaded as a
      # directory: `upload-artifact` neither preserves symlinks nor keeps
      # permissions, and a macOS framework IS a symlink structure (carried over
      # from older-macos-launch.yml).
      - name: Snapshot testable Release app
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA_PATH/Build/Products/Release/EnviousWispr.app"
          [ -d "$APP" ] || {
            echo "::error::Release app missing: $APP"
            exit 1
          }
          tar -czf "$RUNNER_TEMP/enviouswispr-app.tar.gz" \
            -C "$(dirname "$APP")" "$(basename "$APP")"
          ls -lh "$RUNNER_TEMP/enviouswispr-app.tar.gz"

      - name: Upload the app for the older-macOS launch
        if: steps.changes.outputs.needs_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enviouswispr-release-app
          path: ${{ runner.temp }}/enviouswispr-app.tar.gz
          retention-days: 1
          if-no-files-found: error

      # #3013: RUN the suite from the bundles the step above produced. `ew_run_tests`
      # (scripts/lib/xcode-test-run.sh) is the one owner of the run shape for PR,
      # post-merge and nightly: it finds exactly one `<scheme>_*.xctestrun`, runs
      # `test-without-building` (zero compiles in this step, by construction),
      # then hands the log and .xcresult to `ew_lane_verdict` (#2401), which
      # refuses an empty or truncated run. Still serial: parallel Swift Testing
      # was measured unsafe for this suite (Project.swift, the Release scheme).
      #
      # #3019 measured overlapping the eval-package compile with this step on
      # the 3-core hosted runner (PR #3021 head caacfcaa): tests 287 s -> 562 s,
      # eval 342 s -> 723 s, launch-to-join 723 s against 629 s serial, and one
      # timing-sensitive test failed under the load. The overlap went, the test
      # stayed; the eval compile is its own step after this one again.
      - name: Run logic tests (release, Xcode)
        id: release-tests
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/scripts/lib/xcode-test-run.sh"
          . "$GITHUB_WORKSPACE/scripts/lib/ci-phase.sh"
          # #3482: the same run also executes the opt-in SettingsMapExportTests, which writes
          # the Settings Map export here; the next step compares it with reference/. A fresh
          # folder, so a file there can only come from this run.
          rm -rf "$RUNNER_TEMP/settings-map-export"
          mkdir "$RUNNER_TEMP/settings-map-export"
          TEST_RUNNER_EW_SETTINGS_MAP_EXPORT="$RUNNER_TEMP/settings-map-export/settings-map.json" \
          TEST_RUNNER_CI="$TEST_RUNNER_CI" ew_phase tests_release /dev/null -- ew_run_tests \
            "$DERIVED_DATA_PATH/Build/Products" \
            "$XCODE_RELEASE_SCHEME" \
            "$GITHUB_WORKSPACE/xcode-test-release" \
            "PR Release lane" \
            "EnviousWisprTests EnviousWisprDesktopEffectsTests EnviousWisprASRTests"

      # #3524 PR 4: every executed test and its result, for the trusted recorder workflow
      # (ci-test-failure-recorder.yml), which reads only this artifact. Runs whenever the test
      # step ran, pass or fail, and can never change this job's verdict.
      - name: Record Release test identities
        if: ${{ !cancelled() && (steps.release-tests.outcome == 'success' || steps.release-tests.outcome == 'failure') }}
        continue-on-error: true
        env:
          LANE_OUTCOME: ${{ steps.release-tests.outcome }}
        run: |
          python3 scripts/ci/test-identities.py --bundle "$GITHUB_WORKSPACE/xcode-test-release.xcresult" \
            --job build-and-test --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$(git rev-parse HEAD)" --lane-outcome "$LANE_OUTCOME" \
            --out "$RUNNER_TEMP/test-identities/test-identities.json"

      - name: Upload Release test identities
        if: ${{ !cancelled() && (steps.release-tests.outcome == 'success' || steps.release-tests.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-identities-build-and-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-identities/test-identities.json
          if-no-files-found: warn
          retention-days: 35

      # #3482: reference/settings-map.json and .md must equal the export the step above
      # just wrote from the compiled map and vocabulary (no second build or test run). A
      # missing export (the opt-in test did not run) fails here instead of passing.
      - name: Check the Settings Map export is in sync
        if: steps.changes.outputs.needs_build == 'true'
        run: scripts/settings-map/export.sh --from "$RUNNER_TEMP/settings-map-export/settings-map.json" --check

      # #2162: a red lane was undiagnosable from CI because `gh run view --log`
      # truncates at roughly 6 MB and a failing run and a passing run produced an
      # identical tail. Print the failing lines themselves (small, survive
      # truncation); `|| true` so a diagnostic can never be the thing that fails.
      - name: Report Release test failures
        if: failure()
        run: |
          echo "=== Swift Testing failures ==="
          grep -aE "^.*(✘|recorded an issue).*$" xcode-test-release.log | tail -80 || true
          echo "=== last 80 lines ==="
          tail -80 xcode-test-release.log || true

      - name: Upload Release test failure bundle
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xcode-test-release.log
            xcode-test-release.xcresult
          if-no-files-found: warn

      - name: Verify FoundationModels compile probe
        if: steps.changes.outputs.needs_build == 'true'
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"

          cat > /tmp/foundation_models_probe.swift <<'PROBE'
          import Foundation
          import FoundationModels

          func _probe() {
            _ = SystemLanguageModel.default
          }
          PROBE

          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-macos26.0 \
            /tmp/foundation_models_probe.swift \
            -o /tmp/foundation_models_probe

          echo "==> FoundationModels compile probe PASSED"

      # #1836's eval-package compile guard: scripts/ci/compile-eval-packages.sh
      # owns the loop and its rationale since #3019. It was a step here, then
      # its own job from #2114 to #3013, and a step again since #3013: with one
      # required macOS lane per PR the third runner it took was a slot the build
      # lane then waited for. It reads no DerivedData, so it runs last, after
      # the suite (running it BESIDE the suite was measured slower, see the
      # test step). Still gates merges through this job's result in build-check.
      # #3461: the restored Xcode cache (about 20 GB) plus this run's build left
      # too little disk for the three eval packages, each a full dependency
      # graph of its own ("No space left on device"). This workflow restores
      # the cache and never saves it, and nothing from here on reads
      # DerivedData (CI metrics reads logs; the failure uploads read workspace
      # files), so the suite's build is freed first. `find -xdev -delete`, not
      # `rm -rf`, and only after proving the directory is not its own mount.
      - name: Free DerivedData before the eval packages
        if: steps.changes.outputs.needs_build == 'true' && steps.eval_inputs.outputs.needs_eval_packages != 'false'
        run: |
          set -euo pipefail
          echo "==> disk before: $(df -h "$GITHUB_WORKSPACE" | tail -1)"
          if [ -d "$DERIVED_DATA_PATH" ]; then
            if [ "$(stat -f %d "$DERIVED_DATA_PATH")" != "$(stat -f %d "$(dirname "$DERIVED_DATA_PATH")")" ]; then
              echo "::error::$DERIVED_DATA_PATH is a mount point; refusing to delete it"
              exit 1
            fi
            find "$DERIVED_DATA_PATH" -xdev -delete
            [ ! -e "$DERIVED_DATA_PATH" ] || { echo "::error::$DERIVED_DATA_PATH still exists after delete"; exit 1; }
          fi
          echo "==> disk after:  $(df -h "$GITHUB_WORKSPACE" | tail -1)"

      - name: Compile standalone eval packages
        if: steps.changes.outputs.needs_build == 'true' && steps.eval_inputs.outputs.needs_eval_packages != 'false'
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/scripts/lib/ci-phase.sh"
          ew_phase eval_packages eval-packages.log -- scripts/ci/compile-eval-packages.sh

      # #3019: one line of numbers for this job. Advisory: it can never fail
      # the lane, and a broken instrument shows in this step's log instead of
      # printing a plausible line with holes (scripts/ci/ci-metrics.py).
      - name: CI metrics
        if: always() && steps.changes.outputs.needs_build == 'true'
        continue-on-error: true
        env:
          CACHE_MATCHED_KEY: ${{ steps.setup.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          RESTORE_S: ${{ steps.setup.outputs.cache-restore-seconds }}
          RESTORED_KB: ${{ steps.setup.outputs.cache-restored-kb }}
          CAS_VALIDATE: ${{ steps.setup.outputs.cas-validate-outcome }}
          CAS_VALIDATE_S: ${{ steps.setup.outputs.cas-validate-seconds }}
          CAS_KB: ${{ steps.setup.outputs.cas-kb }}
        run: |
          python3 scripts/ci/ci-metrics.py emit \
            --job build-and-test --family release \
            --metrics-file "${EW_CI_METRICS_FILE:-${RUNNER_TEMP:-.}/ew-ci-metrics.env}" \
            --log 'xcode-build-*.log' \
            --set "cache_matched_key=$CACHE_MATCHED_KEY" \
            --set "cache_hit=$CACHE_HIT" \
            --set "restore_s=$RESTORE_S" \
            --set "restored_kb=$RESTORED_KB" \
            --set "cas_validate=$CAS_VALIDATE" \
            --set "cas_validate_s=$CAS_VALIDATE_S" \
            --set "cas_kb=$CAS_KB"

  # Older-macOS launch, advisory (#3013 moved it here from older-macos-launch.yml).
  #
  # Does the app still START on the oldest macOS we support? We build against the
  # macOS 26 SDK with a macOS 14 deployment target: a reference to a macOS 26
  # symbol that is bound STRONGLY makes dyld abort at LAUNCH on macOS 14/15,
  # before any `#available` check in our code runs. The STATIC linkage check is
  # on build-and-test (required). This EMPIRICAL launch stays advisory: it
  # depends on a hosted image with a published retirement date and on starting
  # a GUI app headlessly, neither of which belongs on the path that blocks every
  # merge. It is deliberately NOT in build-check's `needs:`.
  #
  # The app cannot be built on the older runner (it needs the macOS 26 SDK), so
  # build-and-test snapshots its testable Release app and this job carries it to
  # macos-14: a compatibility smoke check (#3348). The notarized app users get is
  # launched on macOS 14 by release.yml launch-on-macos-14 before publishing.
  # Trigger is `needs_build`, deliberately broader than the old workflow's path list.
  older-macos-launch:
    name: Launch on macOS 14 (the deployment target)
    needs: build-and-test
    if: needs.build-and-test.outputs.needs_build == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    # Least privilege: this job runs branch-controlled scripts; artifacts move
    # between jobs of the same run on the Actions runtime token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Report the runner's OS
        run: sw_vers

      - name: Download the app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: enviouswispr-release-app
          path: downloaded

      - name: Unpack the bundle
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf downloaded/enviouswispr-app.tar.gz -C extracted
          # Symlinks must have survived, or the framework is malformed again and the launch would
          # be testing a bundle users never receive.
          links=$(find extracted -type l | wc -l | tr -d ' ')
          echo "==> symlinks preserved: $links"
          [ "$links" -gt 0 ] || { echo "FAIL: no symlinks in the unpacked bundle; the framework structure did not survive transfer" >&2; exit 1; }

      - name: Launch and assert it survives
        run: ./scripts/ci/assert-app-launches.sh extracted/EnviousWispr.app

  # Worker unit suites (#1589). Deliberately UNCONDITIONAL and deliberately
  # running BOTH workers every time: the point is to catch a change under
  # workers/shared/ that breaks the OTHER consumer, which a paths filter or a
  # changed-worker-only run would miss by construction. It is seconds long and
  # needs no macOS runner, so gating it buys nothing and adds a way to be wrong.
  # It does not consume scripts/ci/classify-changes.sh, whose needs_build verdict
  # is about the Swift build and has no opinion about workers.
  #
  # Feeds build-check below, because an advisory job that goes red while the PR
  # stays mergeable is decoration, not a gate.
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Worker unit tests
        run: |
          set -euo pipefail
          # sentry-triage joined this list in #1965. Its 60 tests had existed
          # since #1586 and had never run in CI, which nobody noticed because a
          # test that is never executed reports nothing at all. #1965 added 26
          # more, so the silence would have covered the whole spike-card path.
          # It has no package.json and needs none; `node --test` finds test/.
          # download-counter and shared joined in #2953: the counter's 36 tests
          # had never run here either, and shared/ gained its first test file
          # (the download-intent contract both workers import).
          for w in daily-report weekly-digest sentry-triage download-counter shared; do
            echo "==> $w"
            ( cd "workers/$w" && node --test )
          done

  # Website lane: builds the Astro site and runs the help-centre checks.
  #
  # Before this, `npm run build` ran ONLY on push to main (deploy-blog.yml), so
  # a broken site was discovered after merge, at deploy. The help centre's whole
  # safety story rests on this build and these checks, so it runs before merge.
  #
  # needs_website gating is at STEP level, matching build-and-test: a non-website PR
  # runs this job, skips the work, and reports SUCCESS. A job-level `if` would
  # report `skipped`, which a needs-based aggregator treats as not-success.
  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Job-scoped, not step-scoped: a later step cannot read another step's env,
      # and the conversion check needs the base to read the pre-migration JSON.
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: resolving pull_request.base.sha needs it, and a
          # shallow clone makes the diff fail. Same reason as the build lanes.
          fetch-depth: 0

      - name: Detect website changes
        id: changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify-changes.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Setup Node
        if: steps.changes.outputs.needs_website == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.needs_website == 'true'
        working-directory: website
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.needs_website == 'true'
        working-directory: website
        run: npm run build

      - name: Help centre checks (routes, sitemap, search)
        if: steps.changes.outputs.needs_website == 'true'
        working-directory: website
        run: npm run check:help


  # A PR adding more than a floor of test lines must name how those tests are
  # bound (#2868): a `Recipe: #N` whose recipe VALIDATES against the checkout,
  # which on pull_request is this PR merged with its base (the tree that lands),
  # or one of the two substitutes testing-philosophy.md's ship condition names.
  # Measured 2026-09-13: 8 of 18 such PRs since 2026-09-10 carried none. Runs
  # on every PR (the count decides whether anything more is asked) and needs no
  # Xcode. The declaration is a `Recipe:` commit trailer (#3524): the newest
  # first-parent commit in the PR's base..head range that carries one decides,
  # so the pre-push hook can run the same check before the push. The range
  # comes from the event's PR SHAs, never the merge checkout's HEAD; the issue
  # recipe is validated against the merge checkout. A correction is a new
  # commit (`git commit --allow-empty --trailer "Recipe: #N"`), then push.
  recipe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The count is a three-dot diff against the PR base; a shallow clone
          # cannot resolve it. Same reason as the build lanes.
          fetch-depth: 0

      - name: Test ship condition (recipe named and runnable in the tree that lands)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-test-recipe.py --self-test
          python3 scripts/ci/check-test-recipe.py \
            --trailers --base "$BASE_SHA" --head "$HEAD_SHA" \
            --repo "$PWD" --checkout "$PWD"

  # Required aggregate gate. This is the ONLY required status check on main
  # (ruleset main-protection, context "build-check"); keeping the job id
  # "build-check" preserves that context so no ruleset change is needed (#906).
  # always() && !cancelled(): runs after the lanes even when one fails (so it can
  # fail closed), but is skipped when the whole run is cancelled (a superseded
  # push) so the obsolete SHA shows "cancelled", not a false "Failure".
  build-check:
    needs: [build-and-test, worker-tests, website-check, recipe-check]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Quick checks (#3524)
        run: |
          set -euo pipefail
          # One list, run by this job and by the local pre-push hook
          # (scripts/githooks/pre-push), so the Mac checks what this job would
          # fail on before a push. Every member, with the reason it runs here, is
          # in scripts/ci/fast-checks.sh; members run in parallel and each
          # prints PASS, FAIL or SKIP. The runner's own self-test runs first.
          # Notices and worker tests stay in their own jobs (--ci leaves them out).
          bash scripts/ci/fast-checks.sh --self-test
          bash scripts/ci/fast-checks.sh --ci | tee "$RUNNER_TEMP/fast-checks.out"
          # A SKIP (missing tool) passes on a Mac by design; here it would hide a
          # check the inline steps used to fail on, so this job requires none.
          grep -Eq '^==> fast-checks: [1-9][0-9]* members, 0 failed, 0 skipped$' "$RUNNER_TEMP/fast-checks.out" \
            || { echo "::error::fast-checks skipped a member or printed no summary; every tool must exist on this runner"; exit 1; }

      - name: Require every lane
        env:
          BUILD: ${{ needs.build-and-test.result }}
          WORKER: ${{ needs.worker-tests.result }}
          WEBSITE: ${{ needs.website-check.result }}
          RECIPE: ${{ needs.recipe-check.result }}
        run: |
          set -euo pipefail
          rc=0
          for pair in "build-and-test=$BUILD" "worker-tests=$WORKER" "website-check=$WEBSITE" "recipe-check=$RECIPE"; do
            [ "${pair#*=}" = success ] || { echo "::error::lane did not succeed: $pair"; rc=1; }
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "==> The build-and-test lane, the worker unit suites, the website check and the recipe check passed."

      - name: Report build status
        env:
          NEEDS_BUILD: ${{ needs.build-and-test.outputs.needs_build }}
        run: |
          set -euo pipefail
          # Honest at-a-glance signal for reviewers: distinguish a real Swift
          # build + test pass from a content-only skip, without touching the
          # required-check name or the per-step skip logic (#1089). Runs only
          # after the fail-closed gate above. A missing classification is an
          # error, never "unknown".
          case "$NEEDS_BUILD" in
            true) STATUS="build-check passed: Release build and the full logic suite ran." ;;
            false) STATUS="build-check passed: change classified as content-only, Swift build and tests intentionally skipped." ;;
            *) echo "::error::missing or invalid build classification: '$NEEDS_BUILD'"; exit 1 ;;
          esac
          echo "==> $STATUS"
          echo "$STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=build-check::$STATUS"
